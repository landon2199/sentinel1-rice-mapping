[project]
name = "ricemap"
version = "0.1.0"
description = "Rice vs corn mapping with Sentinel-1 radar time series, compared with Sentinel-2, with spatially honest accuracy assessment"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Landon Melesky" }]

[tool.setuptools]
packages = ["ricemap"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
